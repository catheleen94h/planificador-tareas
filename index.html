<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador</title>
    <link rel="stylesheet" href="css/navbar-lateral.css">
    <link rel="stylesheet" href="css/navbar-superior.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="data:,">
</head>
<body>

    <!-- 1. Menú Lateral (Sidebar) -->
    <div id="contenedor-navbar"></div>

    <!-- Panel Central -->
    <main class="contenedor-principal">
        <!-- 2. Barra de Navegación Superior -->
        <div id="contenedor-top-navbar"></div>

        <section class="seccion-cabecera">
            <div class="titulos-cabecera">
                <h1 class="titulo-principal">Tu semana, con intención.</h1>
                <p class="subtitulo-principal">Organiza lo que viene y dale espacio a lo que importa.</p>
            </div>
            <!-- Botón cambiado a elemento <button> para manejar el evento con JS -->
            <button id="btn-nueva-tarea" class="btn-nueva-tarea">+ Nueva tarea</button>
        </section>

        <h3 class="titulo-seccion-tareas">Lista de Tareas</h3>
        
          <div class="contenedor-tabla-tareas">
            <table class="tabla-tareas">
                <thead>
                    <tr>
                        <th>Tarea</th>
                        <th>Descripción</th>
                        <th>Fecha entrega</th>
                        <th>Asignado A</th>
                        <th>Estado</th>
                        <th>Acciones</th> 
                    </tr>
                </thead>
                <tbody id="contenedor-lista-tareas">
                    <!-- Aqui se muestran las tarjetas -->
                </tbody>
            </table>
        </div>

    </main>

    <!-- VENTANA EMERGENTE (MODAL) DEL FORMULARIO -->
    <div id="contenedor-formulario-modal">
        <div class="modal-contenido">
          
            
            <form id="formulario-tarea"> 
                <div class="tarjeta"> 
                    <div class="tarjeta-titulo">
                        <h3>Nueva Tarea</h3>
                        <p>Todos los campos son obligatorios. Los encontrarás marcados con *.</p>
                    </div>
                    
                    <div class="tarjeta-nombre-descripcion">
                        <div class="nombre">
                            <label for="tarea">Nombre *</label>
                            <input type="text" name="tarea" id="tarea" placeholder="Ej. Comparar dimensiones del documento" required>
                            
                        </div>

                        <div class="descripcion">
                            <label for="descripcion">Descripcion *</label>
                            <input type="text" name="descripcion" id="descripcion" placeholder="Describe que necesitas hacer y el resultado esperado..." required>
                            
                        </div>
                    </div>

                    <div class="tarjeta-asignado">
                       <div class="asignado">
                            <label for="asignadoA">Asignado a: *</label>
                            <input type="text" name="asignadoA" id="asignadoA" required>
                            
                        </div>
                        <div class="fecha-de-entrega">
                            <label for="fechaEntrega">Fecha de Entrega *</label>
                            <input type="date" id="fechaEntrega" required />
                           
                        </div>
                    </div>
                    
                    <div class="tarjeta-estado">
                        <label for="estado">Estado *</label>
                        <select id="estado" required>
                            <option value="" disabled selected>Selecciona estado</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="en proceso">En proceso</option>
                            <option value="revision">Revisión</option>
                            <option value="finalizado">Finalizado</option>
                        </select>
                      
                    </div>
                
                    <div class="tarjeta-boton">
                        <div class="texto">
                            <small>La tarea se añadirá a tu planificación al guardar.</small>
                        </div>
                        <div class="btnes">
                            <button type="button" id="btn-cancelar">Cancelar</button>
                            <button type="submit" id="btn-guardar">Guardar tarea</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts de carga de componentes y renderizado -->
    <script src="js/tarjetas-ejemplo.js"></script>
    <script src="js/cargar-lateral-navbar.js"></script>
    <script src="js/cargar-top-navbar.js"></script>
    <script src="js/formulario.js"></script>
    <script src="js/index.js"></script> 
</body>
</html>
