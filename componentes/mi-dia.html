<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi día - Enfoque y Metas</title>
  <base href="../">
  <link rel="stylesheet" href="css/mi-dia.css">
  <link rel="stylesheet" href="css/navbar-lateral.css">

</head>
<body>

     <div id="contenedor-navbar"></div>
    

  <div class="contenedor-principal">
      
    <header class="seccion-cabecera">
      <div class="titulos-cabecera">
        <h1 class="titulo-principal">Mi día - Enfoque y Metas</h1>
        <p class="subtitulo-principal">Prioridades de hoy, paso a paso.</p>
      </div>
      
    </header>

   
    <main class="cuadricula-panel">
      
   
      <section class="tarjeta">
        <div class="tarjeta-titulo">
          <div>
            <h3>Temporizador de Enfoque</h3>
            <p>Pomodoro de alta productividad</p>
          </div>
        </div>

        <div class="contenedor-temporizador">
          <div class="circulo-temporizador">
            <span class="tiempo-temporizador" id="pantalla-temporizador">25:00</span>
            <span class="etiqueta-temporizador">(Pomodoro)</span>
          </div>
        </div>

        <div class="controles-temporizador">
          <button class="boton-control activo" id="boton-iniciar">Iniciar</button>
          <button class="boton-control" id="boton-pausar">Pausar</button>
          <button class="boton-control" id="boton-reiniciar">Reiniciar</button>
        </div>

        <div class="grupo-campo-enfoque">
          <label for="tarea-enfoque">Nombre la tarea de enfoque</label>
          <input type="text" id="tarea-enfoque" placeholder="Ej: Enfoque en informe de ventas">
        </div>
      </section>

   
      <section class="tarjeta">
        <div class="tarjeta-titulo">
          <div>
            <h2>Metas</h2>
            <p>Tus tareas asignadas para hoy</p>
          </div>
        </div>

        <div class="selector-meta">
          <select id="select-tarea">
            <option value="" disabled selected>Elige una tarea de tu lista</option>
          </select>
          <button type="button" id="btn-agregar-meta" class="boton-control activo">Agregar a metas</button>
        </div>

      <div class="lista-tareas" id="lista-metas"></div>
    </section>

    </main>
  </div>


  <script src="js/cargar-lateral-navbar.js"></script>
  
  <script src="js/mi-dia.js"></script>
</body>
</html>
